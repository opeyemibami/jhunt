[project]
name = "jhunt"
version = "0.0.0"
description = "Job-search assistant on a reusable AI workflow platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.4",
]

[project.scripts]
jhunt-worker = "jhunt.platform.runtime.worker:main"
jhunt-api = "jhunt.api.main:main"

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package lives at the repo root (jhunt/), not under src/.
module-name = "jhunt"
module-root = ""

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.alembic]
script_location = "%(here)s/migrations"
# 0001_baseline.py: revision ids are set by hand with --rev-id, in order.
file_template = "%%(rev)s_%%(slug)s"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.importlinter]
root_package = "jhunt"

[[tool.importlinter.contracts]]
name = "jhunt.platform never imports jhunt.workflows or jhunt.api"
type = "forbidden"
source_modules = ["jhunt.platform"]
forbidden_modules = ["jhunt.workflows", "jhunt.api"]

[[tool.importlinter.contracts]]
name = "api above workflows above platform"
type = "layers"
layers = ["jhunt.api", "jhunt.workflows", "jhunt.platform"]

[[tool.importlinter.contracts]]
name = "workflows never import each other"
type = "independence"
modules = [
    "jhunt.workflows.scout",
    "jhunt.workflows.capture",
    "jhunt.workflows.application_pack",
    "jhunt.workflows.workspace",
    "jhunt.workflows.tracker",
    "jhunt.workflows.prep",
    "jhunt.workflows.funnel",
]
