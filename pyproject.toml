[project]
name = "jhunt"
version = "0.0.0"
description = "Job-search assistant on a reusable AI workflow platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "google-cloud-storage==3.17.1",
    "httpx==0.28.1",
    "langgraph==1.2.15",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.4",
]

[project.scripts]
jhunt-worker = "jhunt.app.worker:main"
jhunt-records-delete = "jhunt.app.records_delete:main"
jhunt-capture = "jhunt.app.capture:main"
jhunt-api = "jhunt.api.main:main"

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.uv]
# The uv CLI pin. Local uv refuses to run at another version, and CI's setup-uv
# installs exactly this one (version-file in ci.yml). Keep uv_build in
# [build-system] at the same version so the CLI and the build backend match.
required-version = "==0.13.1"

[tool.uv.build-backend]
# The package lives at the repo root (jhunt/), not under src/.
module-name = "jhunt"
module-root = ""

[dependency-groups]
dev = [
    "import-linter==2.15",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.alembic]
script_location = "%(here)s/migrations"
# 0001_baseline.py: revision ids are set by hand with --rev-id, in order.
file_template = "%%(rev)s_%%(slug)s"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# google-cloud-storage ships no type information. Only jhunt.platform.artifacts
# imports it (AGENTS.md), so the untyped surface stays in one package.
module = ["google.cloud.*", "google.api_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls a real model provider; runs only with RUN_LIVE_MODEL_TESTS=1",
    "owner: needs the owner's gcloud login; runs only with RUN_OWNER_TESTS=1",
]

[tool.importlinter]
root_package = "jhunt"
# Needed so a contract can name an external package (google, for the storage SDK).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "jhunt.platform never imports jhunt.workflows or jhunt.api"
type = "forbidden"
source_modules = ["jhunt.platform"]
forbidden_modules = ["jhunt.workflows", "jhunt.api"]

[[tool.importlinter.contracts]]
name = "app above api above workflows above platform"
type = "layers"
# jhunt.app is the composition root: it wires workflows into the runtime, so
# nothing below it may import it.
layers = ["jhunt.app", "jhunt.api", "jhunt.workflows", "jhunt.platform"]

[[tool.importlinter.contracts]]
name = "workflows never import each other"
type = "independence"
modules = [
    "jhunt.workflows.scout",
    "jhunt.workflows.capture",
    "jhunt.workflows.application_pack",
    "jhunt.workflows.workspace",
    "jhunt.workflows.tracker",
    "jhunt.workflows.prep",
    "jhunt.workflows.funnel",
]

[[tool.importlinter.contracts]]
# import-linter can only name an external package by its top level, so this
# forbids all of "google" (the storage SDK and its auth libraries) outside
# artifacts; nothing else in jhunt needs them.
name = "only jhunt.platform.artifacts touches the storage SDK"
type = "forbidden"
source_modules = [
    "jhunt.app",
    "jhunt.api",
    "jhunt.workflows",
    "jhunt.platform.config",
    "jhunt.platform.runtime",
    "jhunt.platform.timers",
    "jhunt.platform.gateway",
    "jhunt.platform.memory",
    "jhunt.platform.models",
    "jhunt.platform.events",
    "jhunt.platform.observability",
]
forbidden_modules = ["google"]
# Direct imports only: using storage *through* jhunt.platform.artifacts is the point.
allow_indirect_imports = true
